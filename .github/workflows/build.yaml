name: Build images and propose release
on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/build.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.registry.outputs.prefix }}/${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
  propose:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Update image release in Git
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: python3 scripts/set-release.py kind "ghcr.io/${REPOSITORY,,}" "$IMAGE_TAG"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/kind-images
          commit-message: 'deploy(kind): update application images'
          title: 'deploy(kind): promote built application images'
          body: 'Both application images were built and pushed to GHCR. Merge to update the desired image release. The local Argo CD must track this GitHub repo; see docs/github.md. Promote the same tested tag to EKS separately.'
